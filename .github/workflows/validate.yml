name: Validate Ludia
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.js
      - run: node scripts/check-version-bump.js
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  ui-smoke:
    name: Playwright UI and service-worker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:sw
